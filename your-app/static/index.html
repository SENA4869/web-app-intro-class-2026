<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAYMENT App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1>PAYMENT App</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- PAYMENT入力エリア -->
      <form id="payment-form" class="input-area">
        <input
          type="text"
          id="title-input"
          class="todo-input"
          placeholder="内容（例: 飲み会代）..."
          maxlength="100"
          autocomplete="off"
          required
        />
        <input
          type="text"
          id="payer-input"
          class="todo-input"
          placeholder="支払った人（例: たろう）..."
          maxlength="50"
          autocomplete="off"
          required
        />
        <input
          type="number"
          id="amount-input"
          class="todo-input"
          placeholder="金額（例: 3000）..."
          min="1"
          autocomplete="off"
          required
        />
        <button type="submit" class="todo-button">追加</button>
      </form>

      <!-- PAYMENTリスト -->
      <ul id="payment-list" class="todo-list"></ul>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 PAYMENT App</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
